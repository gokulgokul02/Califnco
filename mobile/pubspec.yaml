name: califnco_water
description: Califnco water purifier e-commerce app — Round 1 Technical Assignment
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Firebase ─────────────────────────────────────────────
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_messaging: ^15.1.6

  # ── State / DI ───────────────────────────────────────────
  flutter_riverpod: ^2.6.1

  # ── UI / Images ──────────────────────────────────────────
  cached_network_image: ^3.4.1
  intl: ^0.19.0

  # ── Payments ─────────────────────────────────────────────
  razorpay_flutter: ^1.3.7

  # ── Utilities ────────────────────────────────────────────
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2

  # ── Location / Map (FREE — no credit card needed) ────────
  # flutter_map: OpenStreetMap tiles, no API key required
  flutter_map: ^7.0.2
  # latlong2: coordinate model for flutter_map
  latlong2: ^0.9.1
  # geolocator: get device GPS coordinates
  geolocator: ^13.0.2

  # ── Push Notifications (foreground) ──────────────────────
  # Shows FCM notifications when app is in foreground
  flutter_local_notifications: ^18.0.1

  # ── HTTP (for EmailJS REST calls) ────────────────────────
  http: ^1.2.2

  # ── Animations ───────────────────────────────────────────
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo.png
